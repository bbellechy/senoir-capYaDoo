name: capyadoo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  http: ^1.2.0

  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  record: ^6.1.0
  path_provider: ^2.1.2
  fluttertoast: ^8.2.4
  intl: ^0.20.2
  flutter_rounded_date_picker: ^3.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sarabun-Light.ttf
          weight: 300
        - asset: assets/fonts/Sarabun-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
